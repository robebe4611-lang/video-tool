<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0c0f">
    <title>Video Tool</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>
        :root { --accent: #34d399; }
        body { font-family: 'Rubik', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        .press { transition: transform .15s cubic-bezier(.16,1,.3,1), background-color .2s, border-color .2s, opacity .2s; }
        .press:active { transform: scale(.98); }
        .fade-in { animation: fadeIn .35s cubic-bezier(.16,1,.3,1) both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .shimmer { background: linear-gradient(90deg, #18181b 0%, #27272a 50%, #18181b 100%); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
        @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        .bar-indet { background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: ind 1.3s ease-in-out infinite; }
        @keyframes ind { from { background-position: -50% 0; } to { background-position: 150% 0; } }
        .opt[aria-checked="true"] { border-color: var(--accent); background: rgba(52,211,153,.07); }
        .opt[aria-checked="true"] .check { opacity: 1; transform: scale(1); }
        .opt .check { opacity: 0; transform: scale(.6); transition: all .2s cubic-bezier(.16,1,.3,1); }
        .opt[aria-disabled="true"] { opacity: .35; pointer-events: none; }
        details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
        details[open] .chev { transform: rotate(180deg); }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="bg-[#0c0c0f] text-zinc-100 min-h-[100dvh] antialiased">

<main class="w-full max-w-md mx-auto px-4 pt-5 pb-10">

    <!-- Header -->
    <header class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-emerald-400/10 border border-emerald-400/20 grid place-items-center text-emerald-400">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </div>
            <h1 class="text-base font-semibold tracking-tight" data-t="title"></h1>
        </div>
        <button onclick="openLangSheet()" id="langBtn" aria-haspopup="dialog"
            class="press flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 rounded-xl ps-2.5 pe-3 py-2 text-xs text-zinc-300">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></svg>
            <span id="langName"></span>
        </button>
    </header>

    <!-- Search: opens a video search, results come back via Share -->
    <form id="searchForm" class="mb-6" onsubmit="event.preventDefault(); webSearch();">
        <div class="flex gap-2">
            <div class="relative w-full min-w-0">
                <svg class="absolute top-1/2 -translate-y-1/2 start-3.5 text-zinc-500" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="searchQ" type="search" enterkeyhint="search" autocomplete="off" dir="auto"
                    class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl ps-10 pe-4 py-3.5 text-[15px] placeholder:text-zinc-600 focus:outline-none focus:border-emerald-400/60">
            </div>
            <button type="submit" class="press shrink-0 bg-zinc-800 hover:bg-zinc-700 px-4 rounded-2xl text-sm" data-t="searchBtn"></button>
        </div>
        <p class="text-xs text-zinc-500 mt-2 leading-relaxed" data-t="searchHint"></p>
    </form>

    <!-- Step 1: link -->
    <section class="mb-5">
        <label for="videoUrl" class="flex items-center gap-2 text-sm text-zinc-400 mb-2">
            <span class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 text-[11px] grid place-items-center">1</span>
            <span data-t="step1"></span>
        </label>
        <div class="flex gap-2">
            <input id="videoUrl" type="url" inputmode="url" dir="ltr" autocomplete="off"
                class="w-full min-w-0 bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3.5 text-[15px] placeholder:text-zinc-600 focus:outline-none focus:border-emerald-400/60">
            <button onclick="pasteAndLoad()" class="press shrink-0 bg-zinc-100 text-zinc-900 font-medium px-4 rounded-2xl text-sm" data-t="paste"></button>
        </div>
        <p id="urlError" class="hidden text-sm text-rose-400 mt-2"></p>
    </section>

    <!-- Video card -->
    <section id="videoCard" class="hidden mb-5"></section>

    <!-- Step 2: format -->
    <section class="mb-5">
        <div class="flex items-center gap-2 text-sm text-zinc-400 mb-2">
            <span class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 text-[11px] grid place-items-center">2</span>
            <span data-t="step2"></span>
        </div>
        <div id="options" class="grid grid-cols-2 gap-2" role="radiogroup"></div>
    </section>

    <!-- Step 3: trim (optional) -->
    <details id="trimBox" class="mb-6 bg-zinc-900/60 border border-zinc-800 rounded-2xl">
        <summary class="press flex items-center justify-between px-4 py-3.5 cursor-pointer text-sm">
            <span class="flex items-center gap-2 text-zinc-300">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>
                <span data-t="trim"></span>
                <span class="text-zinc-500 text-xs" data-t="optional"></span>
            </span>
            <svg class="chev transition-transform text-zinc-500" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="px-4 pb-4 space-y-3">
            <video id="previewPlayer" controls playsinline class="w-full rounded-xl bg-zinc-950 max-h-56 hidden"></video>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-zinc-500 block mb-1.5" data-t="start"></label>
                    <input id="startTime" type="text" inputmode="numeric" value="00:00:00" dir="ltr"
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2.5 text-center font-mono text-sm focus:outline-none focus:border-emerald-400/60">
                    <button type="button" onclick="setFromPlayer('startTime')" class="press player-btn hidden w-full mt-1.5 text-xs text-zinc-400 bg-zinc-800 rounded-lg py-1.5" data-t="fromPlayer"></button>
                </div>
                <div>
                    <label class="text-xs text-zinc-500 block mb-1.5" data-t="end"></label>
                    <input id="endTime" type="text" inputmode="numeric" value="00:00:00" dir="ltr"
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2.5 text-center font-mono text-sm focus:outline-none focus:border-emerald-400/60">
                    <button type="button" onclick="setFromPlayer('endTime')" class="press player-btn hidden w-full mt-1.5 text-xs text-zinc-400 bg-zinc-800 rounded-lg py-1.5" data-t="fromPlayer"></button>
                </div>
            </div>
            <p class="text-xs text-zinc-500" data-t="trimHint"></p>
        </div>
    </details>

    <!-- Main action -->
    <button onclick="startDownload()" id="downloadBtn"
        class="press w-full bg-emerald-400 text-zinc-950 disabled:opacity-40 py-4 rounded-2xl font-semibold text-base flex items-center justify-center gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span id="downloadLabel"></span>
    </button>

    <!-- Progress -->
    <section id="progressBox" class="hidden fade-in mt-4 bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
        <div class="flex items-end justify-between mb-4">
            <div>
                <p id="stageText" class="text-sm text-zinc-400 mb-1"></p>
                <p id="etaBig" class="text-2xl font-semibold tracking-tight"></p>
            </div>
            <p id="percentText" class="font-mono text-2xl font-semibold text-emerald-400" dir="ltr"></p>
        </div>
        <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden" dir="ltr">
            <div id="bar" class="h-full bg-emerald-400 rounded-full transition-[width] duration-500" style="width:0%"></div>
        </div>
        <div class="flex justify-between text-xs text-zinc-500 mt-3 font-mono" dir="ltr">
            <span id="sizeText"></span>
            <span id="speedText"></span>
        </div>
        <p id="bgHint" class="hidden text-xs text-emerald-400/80 mt-3 text-center" data-t="bgHint"></p>
        <button onclick="cancelDownload()" id="cancelBtn" class="press w-full mt-4 border border-zinc-800 hover:bg-zinc-800 py-2.5 rounded-xl text-sm text-zinc-300" data-t="cancel"></button>
    </section>

    <!-- Done -->
    <section id="doneBox" class="hidden fade-in mt-4 bg-zinc-900 border border-emerald-400/30 rounded-2xl p-5 space-y-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 shrink-0 rounded-full bg-emerald-400 text-zinc-950 grid place-items-center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
            </div>
            <div class="min-w-0">
                <p class="text-sm font-medium" data-t="readyTitle"></p>
                <p id="doneName" class="text-xs text-zinc-500 truncate" dir="auto"></p>
                <p class="text-xs text-emerald-400/80 mt-0.5" data-t="inLibraryNote"></p>
            </div>
        </div>
        <button onclick="playItem(doneItemId)" class="press flex items-center justify-center gap-2 w-full bg-emerald-400 text-zinc-950 py-3.5 rounded-xl font-semibold">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span data-t="watchNow"></span>
        </button>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="exportItem(doneItemId)" class="press flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 py-3 rounded-xl text-sm">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                <span data-t="save"></span>
            </button>
            <button onclick="shareItem(doneItemId)" id="shareBtn" class="press flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 py-3 rounded-xl text-sm">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
                <span id="shareLabel" data-t="shareShort"></span>
            </button>
        </div>
        <a id="doneSource" href="#" target="_blank" rel="noopener noreferrer" class="press flex items-center justify-center gap-2 w-full text-zinc-400 hover:text-zinc-200 py-2 text-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
            <span data-t="openSource"></span>
        </a>
        <button onclick="toggleCutPanel()" id="cutBtn" class="press flex items-center justify-center gap-2 w-full border border-zinc-800 hover:bg-zinc-800 py-3 rounded-xl text-sm text-zinc-300">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>
            <span data-t="cutFile"></span>
        </button>
        <div id="cutPanel" class="hidden space-y-3 pt-1">
            <video id="cutPlayer" controls playsinline preload="metadata" class="w-full rounded-xl bg-zinc-950 max-h-56"></video>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-zinc-500 block mb-1.5" data-t="start"></label>
                    <input id="cutStart" type="text" inputmode="numeric" value="00:00:00" dir="ltr"
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2.5 text-center font-mono text-sm focus:outline-none focus:border-emerald-400/60">
                    <button type="button" onclick="cutFromPlayer('cutStart')" class="press w-full mt-1.5 text-xs text-zinc-400 bg-zinc-800 rounded-lg py-1.5" data-t="fromPlayer"></button>
                </div>
                <div>
                    <label class="text-xs text-zinc-500 block mb-1.5" data-t="end"></label>
                    <input id="cutEnd" type="text" inputmode="numeric" value="00:00:00" dir="ltr"
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2.5 text-center font-mono text-sm focus:outline-none focus:border-emerald-400/60">
                    <button type="button" onclick="cutFromPlayer('cutEnd')" class="press w-full mt-1.5 text-xs text-zinc-400 bg-zinc-800 rounded-lg py-1.5" data-t="fromPlayer"></button>
                </div>
            </div>
            <p class="text-xs text-zinc-500" data-t="cutHint"></p>
            <button onclick="startCut()" id="cutGo" class="press w-full bg-zinc-100 text-zinc-900 py-3 rounded-xl font-semibold text-sm" data-t="cutGo"></button>
        </div>
    </section>

    <p id="statusMsg" class="hidden mt-4 text-sm text-center"></p>

    <!-- Library: files kept inside the tool (stored on this phone) -->
    <section class="mt-8">
        <div class="flex items-center justify-between mb-3">
            <h2 class="flex items-center gap-2 text-sm font-semibold">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
                <span data-t="library"></span>
            </h2>
            <span id="libUsage" class="text-xs text-zinc-500 font-mono" dir="ltr"></span>
        </div>
        <div id="libList" class="space-y-2"></div>
    </section>
</main>

<!-- In-app player -->
<div id="playerModal" class="hidden fixed inset-0 z-50 bg-zinc-950 flex flex-col" role="dialog" aria-modal="true">
    <div class="flex items-center justify-between gap-3 p-4">
        <p id="playerTitle" class="text-sm text-zinc-300 truncate" dir="auto"></p>
        <button onclick="closePlayer()" class="press shrink-0 w-10 h-10 rounded-full bg-zinc-800 grid place-items-center" aria-label="close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
    </div>
    <div class="flex-1 grid place-items-center px-2 pb-6">
        <video id="libPlayer" controls playsinline class="w-full max-h-[80dvh] rounded-xl bg-black"></video>
    </div>
</div>

<!-- Language sheet -->
<div id="langSheet" class="hidden fixed inset-0 z-40" role="dialog" aria-modal="true">
    <div class="absolute inset-0 bg-black/60" onclick="closeLangSheet()"></div>
    <div class="fade-in absolute bottom-0 inset-x-0 max-w-md mx-auto bg-zinc-900 border-t border-zinc-800 rounded-t-3xl p-4 pb-6 max-h-[75dvh] flex flex-col">
        <div class="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-3"></div>
        <p class="text-sm font-medium mb-3 px-1 flex items-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></svg>
            <span data-t="language"></span>
        </p>
        <div id="langList" class="grid grid-cols-2 gap-2 overflow-y-auto"></div>
    </div>
</div>

<script src="/i18n.js"></script>
<script>

const STAGE_KEYS = {
    'מתחבר לאתר...': 'st_connecting', 'מוריד וידאו': 'st_video', 'מוריד שמע': 'st_audio',
    'מעבד ומאחד קובץ...': 'st_processing', 'מוריד ומעבד...': 'st_working', 'מוכן!': 'st_done', 'חותך...': 'st_trimming'
};

const OPTION_DEFS = [
    { q: '1080', icon: 'hd' }, { q: '720', icon: 'hd' }, { q: '480', icon: 'phone' }, { q: 'mp3', icon: 'music' }
];
const ICONS = {
    hd: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>',
    phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
    music: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'
};

let lang = 'he';
let info = null;            // last loaded video info
let selected = '720';
let lastProgress = null;

const $ = id => document.getElementById(id);
const t = (key, vars) => {
    let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
    if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
    return s;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function setLang(l) {
    if (!I18N[l]) l = 'en';
    lang = l;
    try { localStorage.setItem('lang', l); } catch {}
    document.documentElement.lang = l;
    document.documentElement.dir = RTL.includes(l) ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    $('videoUrl').placeholder = t('placeholder');
    $('searchQ').placeholder = t('searchPlaceholder');
    document.title = t('title');
    $('langName').textContent = (LANGS.find(x => x.code === l) || {}).name || l;
    renderLangList();
    if (typeof renderLibrary === 'function') renderLibrary();
    renderOptions();
    renderVideoCard();
    if (live) showProgress(live.got || 0);
}

function renderLangList() {
    $('langList').innerHTML = LANGS.map(x => `
        <button onclick="setLang('${x.code}'); closeLangSheet()" dir="auto"
            class="press text-start px-4 py-3 rounded-xl border ${x.code === lang ? 'border-emerald-400 bg-emerald-400/10 text-zinc-100' : 'border-zinc-800 text-zinc-300'}">${x.name}</button>`).join('');
}
function openLangSheet() { $('langSheet').classList.remove('hidden'); }
function closeLangSheet() { $('langSheet').classList.add('hidden'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLangSheet(); });

function detectLang() {
    try { const saved = localStorage.getItem('lang'); if (saved && I18N[saved]) return saved; } catch {}
    for (const n of (navigator.languages || [navigator.language || 'en'])) {
        let c = String(n).slice(0, 2).toLowerCase();
        if (c === 'iw') c = 'he';
        if (c === 'in') c = 'id';
        if (I18N[c]) return c;
    }
    return 'en';
}

/* ---------- helpers ---------- */
function formatTime(sec) {
    const h = Math.floor(sec / 3600).toString().padStart(2, '0');
    const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${h}:${m}:${s}`;
}
function toSec(str) {
    const p = String(str).split(':').map(Number);
    if (p.some(isNaN)) return NaN;
    return p.reduce((a, v) => a * 60 + v, 0);
}
const ltr = s => s ? '\u2066' + s + '\u2069' : '';

// "1:20" / "01:02:03" -> seconds
function etaToSec(str) {
    if (!str) return NaN;
    const p = String(str).trim().split(':').map(Number);
    if (!p.length || p.some(isNaN)) return NaN;
    return p.reduce((a, v) => a * 60 + v, 0);
}

// Friendly duration: "חצי דקה", "2 דקות", "שעה ו-10 דקות"...
function humanDuration(sec) {
    sec = Math.max(0, Math.round(sec));
    const T = (I18N[lang] && I18N[lang].time) || I18N.en.time;
    if (sec < 15) return T.few;
    if (sec < 45) return T.half;
    if (sec < 90) return T.min(1);
    if (sec < 3600) return T.min(Math.round(sec / 60));
    const hrs = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    return m >= 5 ? T.hour(hrs) + T.and + T.min(m) : T.hour(hrs);
}

// Remember this device's typical download speed to predict time before downloading
function getSpeed() { try { return parseFloat(localStorage.getItem('speedBps')) || 0; } catch { return 0; } }
function saveSpeed(bps) {
    if (!(bps > 0)) return;
    const old = getSpeed();
    try { localStorage.setItem('speedBps', String(old ? old * 0.6 + bps * 0.4 : bps)); } catch {}
}
function predictText(bytes) {
    const bps = getSpeed();
    return bytes && bps ? t('approxTime', { t: humanDuration(bytes / bps) }) : '';
}
function formatBytes(b) {
    if (!b) return '';
    if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + ' KB';
    if (b < 1024 ** 3) return (b / 1024 / 1024).toFixed(b < 10 * 1024 * 1024 ? 1 : 0) + ' MB';
    return (b / 1024 ** 3).toFixed(1) + ' GB';
}
function showStatus(msg, isError) {
    const s = $('statusMsg');
    s.textContent = msg || '';
    s.className = 'mt-4 text-sm text-center ' + (isError ? 'text-rose-400' : 'text-zinc-400') + (msg ? '' : ' hidden');
}
function setFromPlayer(id) { $(id).value = formatTime($('previewPlayer').currentTime); updateDownloadLabel(); }

// fraction of the video that will be downloaded (for size estimates)
function trimRange() {
    const dur = info && info.duration ? info.duration : 0;
    let s = toSec($('startTime').value), e = toSec($('endTime').value);
    if (isNaN(s)) s = 0;
    if (isNaN(e) || e === 0) e = dur;
    const full = s <= 0 && (!dur || e >= dur - 1);
    const frac = dur && !full ? Math.max(0, Math.min(1, (e - s) / dur)) : 1;
    return { full, frac };
}
function optionInfo(q) { return info && info.options ? info.options.find(o => o.quality === q) : null; }
function estimatedBytes(q) {
    const o = optionInfo(q);
    return o && o.size ? Math.round(o.size * trimRange().frac) : 0;
}

/* ---------- rendering ---------- */
function renderOptions() {
    $('options').innerHTML = OPTION_DEFS.map(def => {
        const o = optionInfo(def.q);
        const available = !o || o.available;

        const pred = available ? predictText(size) : '';
        const sub = !available ? t('unavailable') : (size ? ltr(t('approx') + formatBytes(size)) + (pred ? ' · ' + pred : '') : t('o' + def.q + 'd'));
        const res = def.q === 'mp3' ? '' : (available && o && o.height ? o.height + 'p' : def.q + 'p');
        return `
        <button type="button" role="radio" class="opt press text-start bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5 relative"
            aria-checked="${selected === def.q}" aria-disabled="${!available}" onclick="selectOption('${def.q}')">

                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
            </span>

            <span class="block text-xs text-zinc-500 mt-0.5">${sub}</span>

}

function selectOption(q) {

function updateDownloadLabel() {

/* ---------- loading video info ---------- */
let loadSeq = 0;
let lastLoadedUrl = '';
async function pasteAndLoad() {
    try {
        const text = await navigator.clipboard.readText();
        if (text) { $('videoUrl').value = text.trim(); loadPreview(); }
    } catch { showStatus(t('pasteHint'), true); }
}

async function loadPreview() {
    const url = $('videoUrl').value.trim();
    $('urlError').classList.add('hidden');
    if (!url) return;
    if (url === lastLoadedUrl && info) return;   // same link already loaded - keep its info
    lastLoadedUrl = url;

    info = null;
    renderVideoCard(true);
    renderOptions();
    showStatus('');
    try {
        const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);

}

$('videoUrl').addEventListener('change', loadPreview);
$('videoUrl').addEventListener('paste', () => setTimeout(loadPreview, 50));
['startTime', 'endTime'].forEach(id => $(id).addEventListener('input', () => { renderOptions(); }));

/* ---------- streaming download: straight into the in-app library, while the server downloads ---------- */
const LIB_KEY = 'library';
let playerUrl = null;
let live = null;               // { ctrl, writable, file, est, t0, samples }
let doneItemId = null;
let cutSource = null;          // library item being trimmed

function libLoad() { try { return JSON.parse(localStorage.getItem(LIB_KEY)) || []; } catch { return []; } }
function libStore(list) { try { localStorage.setItem(LIB_KEY, JSON.stringify(list)); } catch {} }
const hasOPFS = () => !!(navigator.storage && navigator.storage.getDirectory && window.FileSystemFileHandle && 'createWritable' in FileSystemFileHandle.prototype);
async function libDir() { return (await navigator.storage.getDirectory()).getDirectoryHandle('library', { create: true }); }

function fileNameFrom(res, fallback) {
    const cd = res.headers.get('content-disposition') || '';
    const star = /filename\*=UTF-8''([^;]+)/i.exec(cd);
    if (star) { try { return decodeURIComponent(star[1]); } catch {} }
    const plain = /filename="([^"]+)"/i.exec(cd);
    return plain ? plain[1] : fallback;
}

function startDownload() {
    const url = $('videoUrl').value.trim();
    if (!url) { $('urlError').textContent = t('needUrl'); $('urlError').classList.remove('hidden'); $('videoUrl').focus(); return; }
    const { full } = trimRange();
    runDownload({
        url, quality: selected,
        start: full ? '' : $('startTime').value,
        end: full ? '' : $('endTime').value,
        est: estimatedBytes(selected)
    });
}

/* ---------- downloads run on the server: they keep going when you leave the app ---------- */
// 1) the server downloads (continues even if the phone sleeps / the app is closed)
// 2) the phone pulls the finished file into the library, resuming where it stopped
const ACTIVE_KEY = 'activeDownload';
function activeLoad() { try { return JSON.parse(localStorage.getItem(ACTIVE_KEY)); } catch { return null; } }
function activeStore(a) { try { a ? localStorage.setItem(ACTIVE_KEY, JSON.stringify(a)) : localStorage.removeItem(ACTIVE_KEY); } catch {} }

async function runDownload({ url, quality, start, end, est, suffix = '' }) {
    if (live) return;
    $('downloadBtn').disabled = true;
    $('doneBox').classList.add('hidden');
    $('progressBox').classList.remove('hidden');
    $('bgHint').classList.remove('hidden');
    showStatus('');
    live = { phase: 'server', est: est || 0, t0: Date.now(), samples: [], got: 0, audio: quality === 'mp3' };
    showProgress(0);
    try {
        const params = new URLSearchParams({ url, quality, start, end, est: String(est || 0) });
        const res = await fetch('/api/job/start?' + params);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const a = { jobId: data.id, id, url, quality, start, end, est: est || 0, suffix, file: id + (quality === 'mp3' ? '.mp3' : '.mp4') };
        activeStore(a);
        followJob(a);
    } catch (e) { failActive(e.message); }
}

let followSeq = 0;
async function followJob(a) {
    const seq = ++followSeq;
    if (!live) live = { phase: 'server', est: a.est || 0, t0: Date.now(), samples: [], got: 0, audio: a.quality === 'mp3' };
    $('downloadBtn').disabled = true;
    $('doneBox').classList.add('hidden');
    $('progressBox').classList.remove('hidden');
    $('bgHint').classList.remove('hidden');
    // phase 1: wait for the server download
    for (;;) {
        if (seq !== followSeq || !live) return;
        live.beat = Date.now();
        let j;
        try {
            const r = await fetch('/api/job/' + a.jobId);
            if (r.status === 404) {   // server restarted (free host) - start the same download again
                showStatus(t('serverRestarted'));
                const res = await fetch('/api/job/start?' + new URLSearchParams({ url: a.url, quality: a.quality, start: a.start, end: a.end, est: String(a.est || 0) }));
                const d = await res.json();
                if (d.error) throw new Error(d.error);
                a.jobId = d.id; activeStore(a);
                continue;
            }
            j = await r.json();
        } catch (e) {
            if (e.message && !/fetch|network|load/i.test(e.message)) return failActive(e.message);
            await sleep(3000); continue;   // offline for a moment - keep waiting
        }
        if (j.status === 'error') return failActive(j.error || '');
        if (j.status === 'cancelled') return failActive(t('cancelled'));
        if (j.status === 'done') { a.name = j.fileName; a.bytes = j.bytes; activeStore(a); break; }
        showServerProgress(j);
        await sleep(1000);
    }
    // phase 2: bring the file to the phone (resumable)
    if (!hasOPFS()) {   // no in-app storage: hand it to the browser's downloads
        activeStore(null); live = null;
        $('progressBox').classList.add('hidden'); $('downloadBtn').disabled = false;
        location.href = '/api/job/' + a.jobId + '/file';
        return showStatus(t('directStarted'));
    }
    await pullToPhone(a, seq);
}

async function pullToPhone(a, seq) {
    live.phase = 'phone'; live.samples = []; live.t0 = Date.now(); live.est = a.bytes || 0;
    for (let attempt = 0; attempt < 30; attempt++) {
        if (seq !== followSeq || !live) return;
        try {
            const dir = await libDir();
            const fh = await dir.getFileHandle(a.file, { create: true });
            const have = (await fh.getFile()).size;
            if (a.bytes && have >= a.bytes) break;
            live.ctrl = new AbortController();
            const res = await fetch('/api/job/' + a.jobId + '/file', { signal: live.ctrl.signal, headers: have ? { Range: 'bytes=' + have + '-' } : {} });
            if (res.status === 404) throw Object.assign(new Error('gone'), { gone: true });
            if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
            const resumed = res.status === 206;
            const w = await fh.createWritable({ keepExistingData: resumed });
            if (resumed) await w.seek(have);
            live.got = resumed ? have : 0;
            const counter = new TransformStream({ transform(c, ctl) { if (live) { live.got += c.byteLength; live.beat = Date.now(); } ctl.enqueue(c); } });
            const tick = setInterval(() => showProgress(live ? live.got : 0), 500);
            try { await res.body.pipeThrough(counter).pipeTo(w); } finally { clearInterval(tick); }
            break;
        } catch (e) {
            if (e.name === 'AbortError' && (seq !== followSeq || !live)) return;
            if (e.gone) {   // the server no longer has the file (restarted): download again
                try { (await libDir()).removeEntry(a.file); } catch {}
                activeStore(null); live = null;
                showStatus(t('serverRestarted'));
                return runDownload(a);
            }
            await sleep(2000);   // connection dropped (app was in background) - resume
        }
    }
    if (seq !== followSeq || !live) return;
    let name = a.name || 'video';
    if (a.suffix) name = name.replace(/(\.[a-z0-9]+)$/i, ' ' + a.suffix + '$1');
    const file = await (await (await libDir()).getFileHandle(a.file)).getFile();
    const item = { id: a.id, file: a.file, name, bytes: file.size, date: Date.now(), src: a.url, quality: a.quality };
    const elapsed = (Date.now() - live.t0) / 1000;
    if (file.size > 1e6 && elapsed > 2) saveSpeed(file.size / elapsed);
    const list = libLoad(); list.unshift(item); libStore(list);
    activeStore(null); live = null;
    renderLibrary();
    if (await isPlayable(item)) showDone(item);
    else { await removeItem(item); $('progressBox').classList.add('hidden'); $('downloadBtn').disabled = false; showStatus(t('brokenFile'), true); }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function showServerProgress(j) {
    if (!live) return;
    const stage = STAGE_KEYS[j.stage] ? t(STAGE_KEYS[j.stage]) : t('st_working');
    $('stageText').textContent = stage;
    const bar = $('bar');
    if (j.percent !== null && j.percent !== undefined) {
        bar.classList.remove('bar-indet');
        bar.style.width = Math.min(100, j.percent) + '%';
        $('percentText').textContent = Math.floor(j.percent) + '%';
    } else {
        bar.style.width = '100%'; bar.classList.add('bar-indet');
        $('percentText').textContent = '';
    }
    if (j.eta && !isNaN(etaToSec(j.eta))) $('etaBig').textContent = t('left', { t: humanDuration(etaToSec(j.eta)) });
    else $('etaBig').textContent = j.elapsed ? t('elapsedT', { t: j.elapsed }) : t('calc');
    const done = formatBytes(j.bytes), total = formatBytes(j.total);
    $('sizeText').textContent = done ? (total ? `${done} / ${total}` : done) : '';
    $('speedText').textContent = j.speed || '';
}

// phone transfer progress (phase 2)
function showProgress(got) {
    if (!live) return;
    if (live.phase === 'server' && !got) {
        $('stageText').textContent = t('st_connecting');
        $('etaBig').textContent = t('calc');
        $('bar').style.width = '100%'; $('bar').classList.add('bar-indet');
        $('percentText').textContent = ''; $('sizeText').textContent = ''; $('speedText').textContent = '';
        return;
    }
    const now = Date.now();
    live.samples.push([now, got]);
    while (live.samples.length > 2 && now - live.samples[0][0] > 6000) live.samples.shift();
    const [t0, b0] = live.samples[0];
    const rate = now > t0 ? (got - b0) / ((now - t0) / 1000) : 0;
    const est = live.est;
    const pct = est ? Math.min(99, got / est * 100) : null;
    $('stageText').textContent = t('toPhone');
    const bar = $('bar');
    if (pct !== null) { bar.classList.remove('bar-indet'); bar.style.width = pct + '%'; $('percentText').textContent = Math.floor(pct) + '%'; }
    else { bar.style.width = '100%'; bar.classList.add('bar-indet'); $('percentText').textContent = ''; }
    $('etaBig').textContent = est && rate > 0 && got < est ? t('left', { t: humanDuration((est - got) / rate) }) : t('calc');
    $('sizeText').textContent = est ? `${formatBytes(got)} / ${formatBytes(est)}` : formatBytes(got);
    $('speedText').textContent = rate > 0 ? (rate / 1024 / 1024).toFixed(1) + ' MB/s' : '';
}

function failActive(msg) {
    const a = activeLoad();
    if (a) { libDir().then(d => d.removeEntry(a.file)).catch(() => {}); }
    activeStore(null); live = null; followSeq++;
    $('progressBox').classList.add('hidden');
    $('downloadBtn').disabled = false;
    showStatus(t('failed') + msg, true);
}

function cancelDownload() {
    const a = activeLoad();
    if (a && a.jobId) fetch('/api/job/' + a.jobId + '/cancel').catch(() => {});
    if (a) { libDir().then(d => d.removeEntry(a.file)).catch(() => {}); }
    if (live && live.ctrl) { try { live.ctrl.abort(); } catch {} }
    activeStore(null); live = null; followSeq++;
    $('progressBox').classList.add('hidden');
    $('downloadBtn').disabled = false;
    showStatus(t('cancelled'));
}

// Coming back to the app: pick up the download where it is
function resumeActive() {
    const a = activeLoad();
    if (!a) return;
    if (live && live.beat && Date.now() - live.beat < 5000) return;   // still running fine
    if (live && live.ctrl) { try { live.ctrl.abort(); } catch {} }
    live = null;
    followJob(a);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeActive(); });

/* ---------- check a saved file really plays (catches interrupted / glued downloads) ---------- */
async function isPlayable(item) {
    try {
        const file = await libFile(item);
        if (!file.size) return false;
        const url = URL.createObjectURL(file);
        const v = document.createElement('video');
        v.muted = true; v.preload = 'metadata';
        const ok = await new Promise(resolve => {
            const timer = setTimeout(() => resolve(true), 12000);   // slow phone: don't block, assume ok
            v.onloadedmetadata = () => { clearTimeout(timer); resolve(v.duration > 0 || isFinite(v.duration) || v.duration === Infinity); };
            v.onerror = () => { clearTimeout(timer); resolve(false); };
            v.src = url;
        });
        v.removeAttribute('src'); v.load(); URL.revokeObjectURL(url);
        return ok;
    } catch { return false; }
}

async function removeItem(item) {
    try {
        if (item.storage === 'cache') await (await caches.open(FILES_CACHE)).delete(item.key);
        else (await libDir()).removeEntry(item.file);
    } catch {}
    libStore(libLoad().filter(x => x.id !== item.id));
    renderLibrary();
}

// Saved file is damaged: remove it and download again in the foreground (no background mode)
async function verifyOrRetry(item) {
    if (await isPlayable(item)) return true;
    await removeItem(item);
    showStatus(t('brokenRetry'), true);
    if (item.src) runDownload({ url: item.src, quality: item.quality || '720', start: '', end: '', est: item.bytes || 0, noBg: true });
    return false;
}

const FILES_CACHE = 'library-files';
// Pull downloads that finished in the background into the library list
async function syncBackground() {
    try {
        const cache = await caches.open(FILES_CACHE);
        const keys = await cache.keys();
        const added = [];
        const list = libLoad();
        for (const req of keys) {
            const path = new URL(req.url).pathname;
            if (!path.startsWith('/lib-meta/')) continue;
            const meta = await (await cache.match(req)).json();
            if (!list.some(x => x.id === meta.id)) { list.unshift(meta); added.push(meta); }
            await cache.delete(req);
        }
        if (added.length) { libStore(list); renderLibrary(); }
        const good = [];
        for (const it of added) if (await verifyOrRetry(it)) good.push(it);
        return good;
    } catch { return []; }
}

function showDone(item) {
    $('progressBox').classList.add('hidden');
    $('downloadBtn').disabled = false;
    doneItemId = item.id;
    $('doneSource').href = item.src || '#';
    $('doneSource').classList.toggle('hidden', !item.src);
    $('doneName').textContent = item.name + ' · ' + ltr(formatBytes(item.bytes));
    $('cutPanel').classList.add('hidden');
    $('cutPlayer').removeAttribute('src');
    $('doneBox').classList.remove('hidden');
    if (navigator.vibrate) navigator.vibrate(30);
}

/* ---------- trim: pick times on the saved file, then fetch only that part from the source ---------- */
async function toggleCutPanel() {
    const panel = $('cutPanel');
    const opening = panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    if (!opening) return;
    cutSource = libLoad().find(x => x.id === doneItemId);
    if (!cutSource) return;
    try {
        const file = await libFile(cutSource);
        const player = $('cutPlayer');
        if (player.dataset.url) URL.revokeObjectURL(player.dataset.url);
        player.dataset.url = URL.createObjectURL(file);
        player.src = player.dataset.url;
        player.onloadedmetadata = () => { $('cutStart').value = '00:00:00'; $('cutEnd').value = formatTime(player.duration || 0); };
    } catch { showStatus(t('fileGone'), true); }
}
function cutFromPlayer(id) { $(id).value = formatTime($('cutPlayer').currentTime); }

function startCut() {
    if (!cutSource || !cutSource.src) return showStatus(t('fileGone'), true);
    const s = toSec($('cutStart').value), e = toSec($('cutEnd').value);
    if (isNaN(s) || isNaN(e) || e <= s) return showStatus(t('cutBadRange'), true);
    const dur = $('cutPlayer').duration || 0;
    const est = dur ? Math.round(cutSource.bytes * (e - s) / dur) : 0;
    $('cutPlayer').pause();
    const tag = '(' + $('cutStart').value.replace(/:/g, '.') + '-' + $('cutEnd').value.replace(/:/g, '.') + ')';
    runDownload({ url: cutSource.src, quality: cutSource.quality || '720', start: $('cutStart').value, end: $('cutEnd').value, est, suffix: tag });
}

const SHARE_LIMIT = 80 * 1024 * 1024;
async function shareItem(id) {
    const item = libLoad().find(x => x.id === id);
    if (!item) return;
    if (item.bytes > SHARE_LIMIT) return showStatus(t('bigFileHint'));
    try {
        const file = await libFile(item);
        const shareFile = new File([file], item.name, { type: file.type || (item.name.endsWith('.mp3') ? 'audio/mpeg' : 'video/mp4') });
        if (navigator.canShare && navigator.canShare({ files: [shareFile] })) await navigator.share({ files: [shareFile], title: item.name });
        else exportItem(id);
    } catch (e) { if (e.name !== 'AbortError') showStatus(t('shareFailed') + e.message, true); }
}

async function libFile(item) {
    if (item.storage === 'cache') {
        const res = await (await caches.open(FILES_CACHE)).match(item.key);
        if (!res) throw new Error('missing');
        const blob = await res.blob();
        return new File([blob], item.name, { type: blob.type || (item.name.endsWith('.mp3') ? 'audio/mpeg' : 'video/mp4') });
    }
    const dir = await libDir();
    return (await dir.getFileHandle(item.file)).getFile();
}

async function playItem(id) {
    const item = libLoad().find(x => x.id === id);
    if (!item) return;
    try {
        const file = await libFile(item);
        if (playerUrl) URL.revokeObjectURL(playerUrl);
        playerUrl = URL.createObjectURL(file);
        $('playerTitle').textContent = item.name;
        $('libPlayer').src = playerUrl;
        $('playerModal').classList.remove('hidden');
        $('libPlayer').onerror = () => { closePlayer(); showStatus(t('brokenFile'), true); };
        $('libPlayer').play().catch(() => {});
    } catch { showStatus(t('fileGone'), true); }
}

function closePlayer() {
    const p = $('libPlayer');
    p.pause(); p.removeAttribute('src'); p.load();
    if (playerUrl) { URL.revokeObjectURL(playerUrl); playerUrl = null; }
    $('playerModal').classList.add('hidden');
}

async function exportItem(id) {
    const item = libLoad().find(x => x.id === id);
    if (!item) return;
    try {
        const file = await libFile(item);
        const url = URL.createObjectURL(file);
        const a = document.createElement('a');
        a.href = url; a.download = item.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch { showStatus(t('fileGone'), true); }
}

async function deleteItem(id) {
    const item = libLoad().find(x => x.id === id);
    if (!item || !confirm(t('deleteConfirm'))) return;
    try {
        if (item.storage === 'cache') await (await caches.open(FILES_CACHE)).delete(item.key);
        else (await libDir()).removeEntry(item.file);
    } catch {}
    libStore(libLoad().filter(x => x.id !== id));
    renderLibrary();
}

async function renderLibrary() {
    const list = libLoad();
    const box = $('libList');
    if (!list.length) {
        box.innerHTML = `<div class="border border-dashed border-zinc-800 rounded-2xl p-5 text-center text-sm text-zinc-500">${esc(t('libraryEmpty'))}</div>`;
    } else {
        const fmtDate = ms => { try { return new Date(ms).toLocaleDateString(lang); } catch { return ''; } };
        box.innerHTML = list.map(x => `
            <div class="flex items-center gap-3 bg-zinc-900 border border-zinc-800 rounded-2xl p-3">
                <button onclick="playItem('${x.id}')" class="press shrink-0 w-12 h-12 rounded-xl bg-emerald-400/10 text-emerald-400 grid place-items-center" aria-label="${esc(t('play'))}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="min-w-0 flex-1">
                    <p class="text-sm truncate" dir="auto">${esc(x.name)}</p>
                    <p class="text-xs text-zinc-500 mt-0.5">${ltr(formatBytes(x.bytes))} · ${fmtDate(x.date)}</p>
                </div>
                ${x.src ? `<a href="${esc(x.src)}" target="_blank" rel="noopener noreferrer" class="press shrink-0 w-10 h-10 rounded-xl bg-zinc-800 grid place-items-center" aria-label="${esc(t('openSource'))}" title="${esc(t('openSource'))}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></a>` : ''}
                <button onclick="exportItem('${x.id}')" class="press shrink-0 w-10 h-10 rounded-xl bg-zinc-800 grid place-items-center" aria-label="${esc(t('save'))}" title="${esc(t('save'))}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                </button>
                <button onclick="deleteItem('${x.id}')" class="press shrink-0 w-10 h-10 rounded-xl bg-zinc-800 text-zinc-400 grid place-items-center" aria-label="${esc(t('delete'))}" title="${esc(t('delete'))}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
                </button>
            </div>`).join('');
    }
    try {
        const est = await navigator.storage.estimate();
        const used = list.reduce((a, x) => a + (x.bytes || 0), 0);
        $('libUsage').textContent = used ? formatBytes(used) + (est.quota ? ' / ' + formatBytes(est.quota) : '') : '';
    } catch { $('libUsage').textContent = ''; }
}


/* ---------- search + share-to-app ---------- */
function webSearch() {
    const q = $('searchQ').value.trim();
    if (!q) return $('searchQ').focus();
    window.open('https://www.google.com/search?tbm=vid&q=' + encodeURIComponent(q), '_blank', 'noopener');
}



setLang(detectLang());
renderLibrary();
syncBackground();
resumeActive();
// Opened from Android "Share" -> this app: pick the link out of the shared text and load it
(function receiveShared() {
    try {
        const p = new URLSearchParams(location.search);
        const blob = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
        const m = blob.match(/https?:\/\/[^\s"'<>]+/);
        if (!m) return;
        history.replaceState(null, '', location.pathname);
        $('videoUrl').value = m[0];
        loadPreview();
    } catch {}
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
